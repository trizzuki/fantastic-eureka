name: CM Virtual

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022

    steps:
      - name: Configure Android PATH
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME

          "$sdk\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$sdk\emulator" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$sdk\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check Android
        shell: pwsh
        run: |
          Write-Host "Android SDK: $env:ANDROID_HOME"
          adb version
          emulator -version
          sdkmanager --version

      - name: Install Android
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: Create AVD
        shell: pwsh
        run: |
          cmd /c 'echo no | avdmanager create avd -n Pixel35 -k "system-images;android-35;google_apis;x86_64" --force'

      - name: Start Android Emulator
        shell: pwsh
        run: |
          Start-Process "$env:ANDROID_HOME\emulator\emulator.exe" -ArgumentList @(
            "-avd", "Pixel35",
            "-gpu", "swiftshader_indirect",
            "-no-snapshot",
            "-no-boot-anim",
            "-no-audio"
          )

      - name: Wait Android
        shell: pwsh
        run: |
          adb wait-for-device

          do {
            Start-Sleep -Seconds 5
            $boot = (adb shell getprop sys.boot_completed 2>$null).Trim()
            Write-Host "Boot: $boot"
          } while ($boot -ne "1")

          adb devices
          adb shell getprop ro.build.version.release

      - name: Run Script
        shell: pwsh
        run: |
          $key = "${{ secrets.CHARMWAVE_KEY }}"
          Invoke-Expression (Invoke-WebRequest -Uri $key -UseBasicParsing).Content
