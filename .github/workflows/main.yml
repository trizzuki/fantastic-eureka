name: Test 10 Minutes

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022

    steps:
      - name: Start
        shell: pwsh
        run: |
          Write-Host "Runner started"

      - name: Wait 10 Minutes
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Minute $i of 10"
            Start-Sleep -Seconds 60
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Host "Runner finished"
